  <circle fill="#709138" cx="50" cy="35" r="1.5"/>
  <!-- Ear -->
  <ellipse class="elephant" cx="32" cy="45" rx="6" ry="10" opacity="0.8"/>
  <ellipse class="elephant" cx="68" cy="45" rx="6" ry="10" opacity="0.8"/>
</svg>
