      .elephant { fill: #709138; }
    </style>
  </defs>
  <!-- Elephant body and head -->
  <path class="elephant" d="M70,50 C70,45 68,40 65,37 L65,30 C65,25 62,22 58,22 C55,22 52,23 50,25 C48,23 45,22 42,22 C38,22 35,25 35,30 L35,37 C32,40 30,45 30,50 C30,62 38,72 50,72 C62,72 70,62 70,50 Z"/>
  <!-- Legs -->
  <rect class="elephant" x="38" y="70" width="8" height="20" rx="2"/>
  <rect class="elephant" x="54" y="70" width="8" height="20" rx="2"/>
  <!-- Trunk -->
  <path class="elephant" d="M50,22 Q45,18 42,15 Q40,13 38,13 Q35,13 35,16 Q35,19 38,21 Q42,24 46,26 L50,25 Z"/>
